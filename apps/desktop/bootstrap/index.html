<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexum</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }
      .bootstrap {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }
      .menu-card {
        width: 320px;
        padding: 18px;
        border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
        border-radius: 18px;
        background: Canvas;
      }
      button {
        font: inherit;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <main id="root" class="bootstrap">
      <strong>Nexum</strong>
      <p id="bootstrap-status">Starting embedded Runtime…</p>
      <button id="bootstrap-retry" hidden>Retry</button>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const invoke = window.__TAURI__?.core?.invoke;
        if (params.get("surface") !== "menu-bar") {
          if (!invoke) return;
          const statusNode = document.getElementById("bootstrap-status");
          const retry = document.getElementById("bootstrap-retry");
          let timer;
          const render = async () => {
            try {
              const status = await invoke("desktop_runtime_status");
              if (status.state === "ready") {
                location.replace(`${status.origin}/`);
                return;
              }
              statusNode.textContent =
                status.state === "error"
                  ? (status.error ?? "Embedded Runtime failed to start.")
                  : "Starting embedded Runtime…";
              retry.hidden = status.state !== "error";
            } catch (error) {
              statusNode.textContent = String(error);
              retry.hidden = false;
            }
            timer = setTimeout(render, 250);
          };
          retry.addEventListener("click", async () => {
            retry.hidden = true;
            statusNode.textContent = "Restarting embedded Runtime…";
            try {
              await invoke("desktop_runtime_restart");
            } catch (error) {
              statusNode.textContent = String(error);
              retry.hidden = false;
            }
          });
          window.addEventListener("beforeunload", () => clearTimeout(timer));
          void render();
          return;
        }
        const root = document.getElementById("root");
        root.className = "menu-card";
        root.innerHTML =
          '<strong>Nexum</strong><p id="status">Reading Runtime status…</p><button id="open">Open Nexum</button>';
        if (!invoke) return;
        invoke("desktop_runtime_status")
          .then((status) => {
            document.getElementById("status").textContent =
              `${status.state} · ${status.ownership} · ${status.version ?? "Runtime"}`;
          })
          .catch(() => {
            document.getElementById("status").textContent = "Runtime unavailable";
          });
        document.getElementById("open").addEventListener("click", () => {
          void invoke("open_main_window");
        });
      })();
    </script>
  </body>
</html>
