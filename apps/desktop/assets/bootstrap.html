<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Nexum</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }
      main {
        width: min(420px, calc(100vw - 48px));
        padding: 32px;
        text-align: center;
      }
      .mark {
        width: 42px;
        height: 42px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: #6366f1;
        color: white;
        font-weight: 800;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      p {
        margin: 10px 0 0;
        color: color-mix(in srgb, CanvasText 62%, transparent);
        font-size: 13px;
        line-height: 1.55;
      }
      .error {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">N</div>
      <h1 id="title">Nexum</h1>
      <p id="message">Starting local Runtime…</p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const title = params.get("title");
      const message = params.get("message");
      if (title) document.getElementById("title").textContent = title;
      if (message) document.getElementById("message").textContent = message;
      if (params.get("tone") === "error") {
        document.getElementById("message").classList.add("error");
      }
    </script>
  </body>
</html>
