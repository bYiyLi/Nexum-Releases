name: Nexum Release Qualification

on:
  repository_dispatch:
    types: [release_candidate]

permissions:
  contents: read

jobs:
  runtime-macos:
    name: Runtime / darwin-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.client_payload.publicCommit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Download Runtime candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern nexum-runtime.tgz --pattern runtime-manifest.json --pattern SHA256SUMS.txt
      - name: Qualify same-bytes Runtime
        run: node qualification/runtime-qualification.mjs --artifact candidate/nexum-runtime.tgz --manifest candidate/runtime-manifest.json --checksums candidate/SHA256SUMS.txt

  runtime-windows:
    name: Runtime / windows-amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.client_payload.publicCommit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Download Runtime candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern nexum-runtime.tgz --pattern runtime-manifest.json --pattern SHA256SUMS.txt
      - name: Qualify same-bytes Runtime
        shell: bash
        run: node qualification/runtime-qualification.mjs --artifact candidate/nexum-runtime.tgz --manifest candidate/runtime-manifest.json --checksums candidate/SHA256SUMS.txt

  runtime-linux:
    name: Runtime / linux-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.client_payload.publicCommit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Download Runtime candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern nexum-runtime.tgz --pattern runtime-manifest.json --pattern SHA256SUMS.txt
      - name: Qualify same-bytes Runtime
        run: node qualification/runtime-qualification.mjs --artifact candidate/nexum-runtime.tgz --manifest candidate/runtime-manifest.json --checksums candidate/SHA256SUMS.txt

  public-headless-macos:
    name: Public CLI / darwin-arm64
    needs: [runtime-macos, runtime-windows, runtime-linux]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.client_payload.publicCommit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Download candidate metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern nexum-runtime.tgz --pattern runtime-manifest.json --pattern SHA256SUMS.txt
      - name: Install from public GitHub URL
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: node qualification/runtime-qualification.mjs --artifact candidate/nexum-runtime.tgz --manifest candidate/runtime-manifest.json --checksums candidate/SHA256SUMS.txt --install-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/nexum-runtime.tgz"

  public-headless-windows:
    name: Public CLI / windows-amd64
    needs: [runtime-macos, runtime-windows, runtime-linux]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.client_payload.publicCommit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Download candidate metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern nexum-runtime.tgz --pattern runtime-manifest.json --pattern SHA256SUMS.txt
      - name: Install from public GitHub URL
        shell: bash
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: node qualification/runtime-qualification.mjs --artifact candidate/nexum-runtime.tgz --manifest candidate/runtime-manifest.json --checksums candidate/SHA256SUMS.txt --install-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/nexum-runtime.tgz"

  public-headless-linux:
    name: Public CLI / linux-amd64
    needs: [runtime-macos, runtime-windows, runtime-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.client_payload.publicCommit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Download candidate metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern nexum-runtime.tgz --pattern runtime-manifest.json --pattern SHA256SUMS.txt
      - name: Install from public GitHub URL
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: node qualification/runtime-qualification.mjs --artifact candidate/nexum-runtime.tgz --manifest candidate/runtime-manifest.json --checksums candidate/SHA256SUMS.txt --install-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/nexum-runtime.tgz"

  desktop-macos:
    name: Desktop build / macOS arm64
    needs: [runtime-macos, runtime-windows, runtime-linux]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.client_payload.publicCommit }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: rustup default stable
      - name: Download exact Runtime candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern nexum-runtime.tgz --pattern runtime-manifest.json --pattern SHA256SUMS.txt
      - name: Stage embedded Runtime
        run: |
          node scripts/prepare-desktop-runtime.mjs --artifact candidate/nexum-runtime.tgz --manifest candidate/runtime-manifest.json --checksums candidate/SHA256SUMS.txt
          node scripts/prepare-desktop-bootstrap.mjs
      - name: Verify Desktop source boundary
        shell: bash
        run: |
          ! git grep -n "releases/latest/download\|runtime-manifest.json" -- apps/desktop/src-tauri apps/desktop/bootstrap
          git grep -q "windows_subsystem = \"windows\"" -- apps/desktop/src-tauri/src/main.rs
          git grep -q "CREATE_NO_WINDOW" -- apps/desktop/src-tauri/src/daemon_lifecycle.rs
      - name: Test Desktop Rust source
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build public Desktop app
        env:
          RUSTFLAGS: -Dwarnings
        run: pnpm dlx @tauri-apps/cli@2.11.4 build --bundles app --no-sign --ci
        working-directory: apps/desktop
      - name: Package and qualify DMG
        shell: bash
        run: |
          node scripts/verify-desktop-release.mjs
          node scripts/package-macos-dmg.mjs
          node scripts/verify-macos-dmg.mjs --adhoc
          runtime_sha="$(node -e "console.log(require('./candidate/runtime-manifest.json').current.sha256)")"
          node qualification/desktop-qualification.mjs --installer "$(find dist/release/macos -name '*.dmg' -print -quit)" --runtime-sha "$runtime_sha"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-macos-arm64
          path: dist/release/macos/*.dmg
          if-no-files-found: error
          retention-days: 1

  desktop-windows:
    name: Desktop build / Windows x64
    needs: [runtime-macos, runtime-windows, runtime-linux]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.client_payload.publicCommit }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: rustup default stable
      - name: Download exact Runtime candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern nexum-runtime.tgz --pattern runtime-manifest.json --pattern SHA256SUMS.txt
      - name: Stage embedded Runtime
        shell: bash
        run: |
          node scripts/prepare-desktop-runtime.mjs --artifact candidate/nexum-runtime.tgz --manifest candidate/runtime-manifest.json --checksums candidate/SHA256SUMS.txt
          node scripts/prepare-desktop-bootstrap.mjs
      - name: Verify Desktop source boundary
        shell: bash
        run: |
          ! git grep -n "releases/latest/download\|runtime-manifest.json" -- apps/desktop/src-tauri apps/desktop/bootstrap
          git grep -q "windows_subsystem = \"windows\"" -- apps/desktop/src-tauri/src/main.rs
          git grep -q "CREATE_NO_WINDOW" -- apps/desktop/src-tauri/src/daemon_lifecycle.rs
      - name: Test Desktop Rust source
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build public Desktop NSIS installer
        env:
          RUSTFLAGS: -Dwarnings
        run: pnpm dlx @tauri-apps/cli@2.11.4 build --bundles nsis
        working-directory: apps/desktop
      - name: Qualify installed Windows Desktop
        shell: bash
        run: |
          runtime_sha="$(node -e "console.log(require('./candidate/runtime-manifest.json').current.sha256)")"
          node qualification/desktop-qualification.mjs --installer "$(find apps/desktop/src-tauri/target/release/bundle/nsis -name '*.exe' -print -quit)" --runtime-sha "$runtime_sha"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish complete Nexum release
    needs:
      - public-headless-macos
      - public-headless-windows
      - public-headless-linux
      - desktop-macos
      - desktop-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true
      - name: Attach installers and promote same candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          gh release upload "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest \
            --notes "Nexum Universal Runtime and self-contained Desktop installers. The same Runtime bytes were qualified on macOS arm64, Windows x64, and Linux x64; macOS and Windows installers embed that exact Runtime and passed installed launch qualification. The macOS DMG is ad-hoc sealed and not notarized."
          for asset in nexum-runtime.tgz runtime-manifest.json SHA256SUMS.txt; do
            curl --fail --location --silent --show-error --output /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$asset"
          done
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith(".dmg"))] | length')" = "1"
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith(".exe"))] | length')" = "1"
